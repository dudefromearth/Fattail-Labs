# MiniThree (or any nginx in front of Labs) — H2 SSO JWT log hygiene
#
# Problem: fotw-sso redirects to Labs as:
#   GET /api/auth/sso/wordpress:fattail?sso=<JWT>
# Access logs that store $request_uri retain the full bearer token.
#
# Install (example paths — adjust to MiniThree layout):
#   1. Copy this file into conf.d or include from the labs.fattail.ai server block.
#   2. nginx -t && nginx -s reload
#
# Option A (simplest): for SSO locations only, log URI without query string.

log_format labs_no_query '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';

