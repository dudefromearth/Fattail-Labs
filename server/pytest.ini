[pytest]
# Fail the suite on any warning so new deprecations cannot hide.
# Ignored (third-party / stdlib noise, not ours):
# - Starlette 1.3 still imports httpx (httpx2 is the successor)
# - Python 3.14 urllib HTTPError GC emits ResourceWarning; pytest then
#   wraps it as PytestUnraisableExceptionWarning. Not a product leak we
#   can close without changing Massive miss handling.
filterwarnings =
    error
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
    ignore::ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
