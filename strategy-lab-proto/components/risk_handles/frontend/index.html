<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Risk Graph Handles</title>
    <script src="./streamlit-component-lib.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #12141a;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #wrap {
        position: relative;
        width: 100%;
        height: 440px;
      }
      canvas {
        display: block;
        width: 100%;
        height: 440px;
        cursor: default;
        touch-action: none;
      }
      #hint {
        position: absolute;
        left: 68px;
        bottom: 8px;
        color: #8b919a;
        font-size: 11px;
        pointer-events: none;
        user-select: none;
      }
      #badge {
        position: absolute;
        top: 12px;
        right: 16px;
        background: rgba(245, 158, 11, 0.92);
        color: #111;
        font-weight: 700;
        font-size: 12px;
        padding: 3px 8px;
        border-radius: 4px;
        display: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="c"></canvas>
      <div id="hint">Drag amber handles to resize · <b>Shift+drag</b> = slide whole position strike-by-strike</div>
      <div id="badge"></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
